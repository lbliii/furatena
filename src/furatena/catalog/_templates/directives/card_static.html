{% set card_class = "chirp-theme-directive-card" ~ (" " ~ extra_class if extra_class else "") %}

{% if icon_html %}<div class="chirpui-card__icon" aria-hidden="true">{{ icon_html }}</div>{% end %}
{{ body }}
{% end %}
