<div class="chirp-theme-directive-tabs fura-tabs{{ ' chirp-theme-directive-tabs--code' if variant == 'code-tabs' else '' }} chirpui-stack chirpui-stack--md"
     x-data='{{ tab_x_data }}'
     x-cloak
     {% if sync_key %}data-sync="{{ sync_key }}"{% end %}>
<nav class="chirpui-tabs" role="tablist">
{% for tab in tabs %}
<button type="button" class="chirpui-tab" role="tab"
        :class="{ 'chirpui-tab--active': active === '{{ tab.id }}' }"
        @click="pick('{{ tab.id }}')"
        :aria-selected="(active === '{{ tab.id }}').toString()"
        {% if tab.disabled %}disabled aria-disabled="true"{% end %}>
{% if tab.icon %}<span aria-hidden="true">{{ tab.icon | safe }}</span>{% end %}
<span class="chirp-theme-directive-tabs__label">{{ tab.label | safe }}</span>
{% if tab.badge %}<span class="chirpui-badge">{{ tab.badge }}</span>{% end %}
</button>
{% end %}
</nav>
<div class="fura-tab-panels">
{% for tab in tabs %}
<div class="fura-tab-panel" role="tabpanel" x-show="active === '{{ tab.id }}'">{{ tab.panel | safe }}</div>
{% end %}
</div>
</div>
