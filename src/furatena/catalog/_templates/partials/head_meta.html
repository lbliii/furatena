{% if node is defined and node %}
<meta id="chirpui-doc-description" name="description" content="{{ node.description or node.title }}"{% if oob | default(false) %} hx-swap-oob="true"{% end %}>
<link id="chirpui-doc-canonical" rel="canonical" href="{{ canonical_url }}"{% if oob | default(false) %} hx-swap-oob="true"{% end %}>
<link id="fura-llms-index" rel="alternate" type="text/markdown" href="{{ llms_url }}" title="{{ site_name }} documentation index"{% if oob | default(false) %} hx-swap-oob="true"{% end %}>
<link id="fura-page-markdown" rel="alternate" type="text/markdown" href="{{ markdown_url }}" title="{{ node.title }} in Markdown"{% if oob | default(false) %} hx-swap-oob="true"{% end %}>
<meta id="chirpui-doc-og-title" property="og:title" content="{{ node.title }}"{% if oob | default(false) %} hx-swap-oob="true"{% end %}>
<meta id="chirpui-doc-og-description" property="og:description" content="{{ node.description or node.title }}"{% if oob | default(false) %} hx-swap-oob="true"{% end %}>
<meta id="chirpui-doc-og-type" property="og:type" content="article"{% if oob | default(false) %} hx-swap-oob="true"{% end %}>
{% if canonical_url %}
<meta id="chirpui-doc-og-url" property="og:url" content="{{ canonical_url }}"{% if oob | default(false) %} hx-swap-oob="true"{% end %}>
{% end %}
{% if og_image_url %}
<meta id="chirpui-doc-og-image" property="og:image" content="{{ og_image_url }}"{% if oob | default(false) %} hx-swap-oob="true"{% end %}>
{% end %}
{% if json_ld is defined and json_ld %}
<script id="chirpui-doc-jsonld" type="application/ld+json"{% if oob | default(false) %} hx-swap-oob="true"{% end %}>{{ json_ld }}</script>
{% end %}
{% if alternate_links is defined %}
{% for link in alternate_links %}
<link rel="alternate" hreflang="{{ link.hreflang }}" href="{{ link.href }}"{% if oob | default(false) %} hx-swap-oob="true"{% end %}>
{% end %}
{% end %}
{% else %}
<meta name="description" content="{{ site_description | default('Furatena documentation — markdown indexed live, served as htmx fragments.') }}">
<meta property="og:title" content="{{ site_name | default('Furatena') }}">
<meta property="og:description" content="{{ site_description | default('Furatena documentation — markdown indexed live, served as htmx fragments.') }}">
{% end %}
