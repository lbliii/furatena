{% if author_chrome is defined and author_chrome %}
<div
  id="fura-author-sse"
  hidden
  hx-ext="sse"
  sse-connect="/docs/_author/events?slug={{ node.slug }}"
  hx-disinherit="hx-target hx-swap"
  hx-target="this"
>
  <div hidden sse-swap="author-invalidate" hx-target="this" hx-swap="none"></div>
</div>
{% end %}
