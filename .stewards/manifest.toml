[judgment.catalog]
advocate = [
  "One canonical identity and policy path shared by live, frozen, static, PDF, search, DCP, publication, and agent consumers.",
  "Focused cross-surface regression matrices when changed values cross delivery boundaries.",
]
do_not = [
  "Patch only the visible renderer when the underlying IR, graph, policy, or manifest is wrong.",
  "Introduce parallel truth in generated JSON, HTML, templates, caches, or deployment metadata.",
]

[judgment.sources]
advocate = [
  "Small adapters over one normalized IR with source locations and provenance.",
  "Malformed-source tests for every supported format.",
]
do_not = [
  "Leak parser-library objects past the adapter boundary.",
  "Silently discard unsupported syntax, front matter, links, or identity.",
]

[judgment.tests]
advocate = [
  "Executable bug reports that prove positive behavior and forbidden leakage.",
  "Narrow checks first, then the owning CI lane and full suite in proportion to risk.",
]
do_not = [
  "Bless regressions by weakening assertions, snapshots, thresholds, exemptions, or baselines.",
  "Depend on incidental ordering, generated IDs, whitespace, or local generated artifacts.",
]
