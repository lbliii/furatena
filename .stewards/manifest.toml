[[steward]]
id = "root"
path = "AGENTS.md"
point_of_view = "Protect Furatena's cross-surface documentation contracts and route work to the narrowest knowledgeable steward."
edges = [
  { to = "package", type = "governs", what = "installed API and packaging" },
  { to = "catalog", type = "governs", what = "content graph and delivery pipeline" },
  { to = "tests", type = "verified-by", what = "executable evidence" },
  { to = "docs", type = "explained-by", what = "architecture and operating contracts" },
]

[[steward]]
id = "package"
path = "src/furatena/AGENTS.md"
point_of_view = "Keep the installed Furatena package, public imports, typing marker, dependencies, entry points, and release artifacts coherent."
guardrails = [
  "`pyproject.toml`, `uv.lock`, package data, `fura` entry point, README commands, and isolated install smoke move together.",
  "Optional source formats stay optional and local co-development overrides never enter committed project metadata.",
]
owns.code = ["src/furatena/*.py", "pyproject.toml", "uv.lock"]
owns.tests = ["tests/test_catalog_packaging.py", "tests/test_release_publishing.py"]
owns.docs = ["README.md", "docs/RELEASING.md"]
edges = [{ to = "cli", type = "exposes", what = "fura entry point" }, { to = "github", type = "published-by", what = "release workflow" }]

[[steward]]
id = "catalog"
path = "src/furatena/catalog/AGENTS.md"
point_of_view = "Keep the catalog graph, dual IR, visibility, lifecycle, render, freeze, export, search, publication, and agent surfaces one coherent system."
guardrails = [
  "Trace changed values from source through Content IR, graph/policy transforms, render context, and every reached output surface.",
  "Identity, visibility, base paths, provenance, incremental invalidation, and atomic publication remain deterministic.",
  "Flat catalog modules stay cohesive; do not create a new subsystem or configuration axis without an explicit boundary decision.",
]
owns.code = ["src/furatena/catalog/*.py"]
owns.tests = ["tests/test_chirp_docs_catalog_surfaces.py", "tests/test_chirp_docs_graph_structure.py", "tests/test_chirp_docs_static_export.py"]
owns.docs = ["docs/DUAL_IR.md", "docs/DCP.md", "docs/VIEWS.md"]
edges = [{ to = "sources", type = "fed-by", what = "normalized sources" }, { to = "app", type = "served-by", what = "live runtime" }, { to = "content", type = "built-from", what = "repository content" }]

[[steward]]
id = "autodoc"
path = "src/furatena/catalog/autodoc/AGENTS.md"
point_of_view = "Keep Python autodoc extraction deterministic, source-attributed, and compatible with the same IR and reference contracts as authored content."
guardrails = [
  "Extraction never imports arbitrary project code when static analysis can answer safely.",
  "Generated members preserve stable identity, signatures, ordering, provenance, and actionable unsupported-shape diagnostics.",
]
owns.code = ["src/furatena/catalog/autodoc/"]
owns.tests = ["tests/test_chirp_contract_inventory.py", "tests/test_docs_reference.py"]
owns.docs = ["docs/AUTHORING.md"]
edges = [{ to = "catalog", type = "produces", what = "generated catalog nodes" }, { to = "references", type = "linked-by", what = "API references" }]

[[steward]]
id = "directives"
path = "src/furatena/catalog/directives/AGENTS.md"
point_of_view = "Keep directive syntax, validation, IR effects, safe HTML boundaries, and Kida rendering consistent across formats."
guardrails = [
  "Directive registration, parsing, node shape, HTML output, link extraction, errors, docs, and tests move together.",
  "Includes remain bounded and provenance-aware; raw HTML and embeds never bypass trust or visibility policy.",
]
owns.code = ["src/furatena/catalog/directives/"]
owns.tests = ["tests/test_chirp_docs_directives.py", "tests/test_chirp_docs_list_table.py", "tests/test_safe_html_boundaries.py"]
