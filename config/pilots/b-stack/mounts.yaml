# Isolated public pilot configuration. Production app/mounts.yaml does not include
# these sources. Keep remotes canonical so sync provenance never depends on a
# developer's checkout layout.
mounts:
  - id: bengal
    label: Bengal
    default: true
    url_prefix: /bengal
    source:
      provider: git
      repo: https://github.com/lbliii/bengal.git
      ref: main
      path: site/content
    editions: &pilot_editions
      source: tags
      count: 3
      pattern: "v*"
      strip_prefix: "v"
      sort: semver-desc
      include_prereleases: false

  - id: chirp
    label: Chirp
    url_prefix: /chirp
    source:
      provider: git
      repo: https://github.com/lbliii/chirp.git
      ref: main
      path: site/content
    editions: *pilot_editions

  - id: chirp-ui
