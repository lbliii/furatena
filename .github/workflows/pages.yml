name: Validate and deploy Furatena

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_GIL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Fast lint and unit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14t"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: Install
        run: uv sync --group dev
      - name: Fast lane
        run: make ci-fast

  contract:
    name: Hypermedia and diagnostic contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14t"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: Install
        run: uv sync --group dev
      - name: Contract lane
        run: make ci-contract

  coverage:
    name: Core coverage ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14t"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: Install
        run: uv sync --group dev
      - name: Coverage lane
        run: make ci-coverage

  export:
    name: Static export artifact
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14t"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: Install
        run: uv sync --group dev
      - name: Export lane
        run: make ci-export
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/public

  browser:
    name: Author browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14t"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: Install
        run: uv sync --group dev
      - name: Install browser runtime
        run: uv run playwright install --with-deps chromium
      - name: Browser smoke lane
        if: github.event_name == 'pull_request'
        run: make ci-browser-smoke
      - name: Browser full lane
        if: github.event_name != 'pull_request'
        run: make ci-browser-full
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ github.event_name }}-${{ github.sha }}
          path: browser-results/*.xml
          if-no-files-found: error
          retention-days: 14

  agent:
    name: Agent and MCP contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14t"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: Install
        run: uv sync --group dev
      - name: Agent lane
        run: make ci-agent

  release:
    name: Package and CLI smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14t"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: Install
        run: uv sync --group dev
      - name: Release lane
        run: make ci-release
      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [fast, contract, coverage, export, browser, agent, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
