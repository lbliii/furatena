changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Security
      labels:
        - security
    - title: Features
      labels:
        - enhancement
    - title: Fixes and maintenance
      labels:
        - bug
        - maintenance
    - title: Other changes
      labels:
        - "*"
