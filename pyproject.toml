[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "furatena"
version = "0.1.0"
description = "Hypermedia documentation catalog for Chirp — live graph, dual IR, fura CLI"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Bengal Contributors", email = "lbeezr@icloud.com" }]
keywords = [
    "documentation",
    "hypermedia",
    "htmx",
    "catalog",
    "chirp",
    "markdown",
    "static-site",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "bengal-chirp[forms,sessions]>=0.8.1",
    "chirp-ui>=0.11.0",
    "patitas[syntax]>=0.4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.15",
    "httpx>=0.27",
]

[project.scripts]
fura = "furatena.cli.main:main"

[project.urls]
Homepage = "https://github.com/lbliii/furatena"
Repository = "https://github.com/lbliii/furatena"
Documentation = "https://github.com/lbliii/furatena/tree/main/docs"

[tool.uv]
python-preference = "only-managed"

# Local Chirp development — point at your checkout until the next PyPI release.
# Adjust the path for your machine or remove when consuming released chirp only.
[tool.uv.sources]
bengal-chirp = { path = "/Users/llane/conductor/workspaces/chirp/surabaya-v6", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"furatena.catalog" = ["py.typed", "schemas/*.json", "_templates/**/*.html"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "SIM", "I", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"app/**/*.py" = ["E402", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
asyncio_mode = "auto"
addopts = ["-ra", "-q", "--import-mode=importlib"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.15",
    "httpx>=0.27",
]
