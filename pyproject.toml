[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "furatena"
version = "0.1.0"
description = "Hypermedia documentation catalog for Chirp — live graph, dual IR, fura CLI"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Bengal Contributors", email = "lbeezr@icloud.com" }]
keywords = [
    "documentation",
    "hypermedia",
    "htmx",
    "catalog",
    "chirp",
    "markdown",
    "static-site",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "bengal-chirp[forms,sessions]>=0.8.2,<0.9.0",
    "chirp-ui>=0.11.0",
    "patitas[syntax]>=0.4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "milo-cli>=0.2.2",
    "reportlab>=5.0.0",
    "pypdf>=6.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.15",
    "httpx>=0.27",
]

[project.scripts]
fura = "furatena.cli.main:main"

[project.entry-points."furatena.themes"]
lagoon = "furatena.themes.lagoon:PACK"

[project.urls]
Homepage = "https://github.com/lbliii/furatena"
Repository = "https://github.com/lbliii/furatena"
Documentation = "https://github.com/lbliii/furatena/tree/main/docs"

[tool.uv]
python-preference = "only-managed"

# Optional: local Chirp co-development. Uncomment and set path on your machine.
# [tool.uv.sources]
# bengal-chirp = { path = "../chirp", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"furatena.catalog" = [
  "py.typed",
  "schemas/*.json",
  "fixtures/dcp/*.json",
  "_templates/**/*.html",
  "vendor/*.js",
]
"furatena.themes.lagoon" = [
  "*.css",
  "skin/*.css",
  "js/*.js",
  "assets/fonts/*.woff2",
]
"furatena.themes.furatena" = [
  "assets/css/**/*.css",
  "assets/icons/**/*.svg",
  "assets/icons/**/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "SIM", "I", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "RUF012", "S101"]
"app/**/*.py" = ["E402", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
asyncio_mode = "auto"
addopts = ["-ra", "-q", "--import-mode=importlib"]
markers = [
    "slow: runs a larger static export or frozen-catalog path",
    "browser: runs a real browser against a local Furatena server",
    "browser_smoke: smallest critical browser search, navigation, and author reload paths",
    "browser_authoring: browser author preview, edit, save, and create workflows",
    "browser_responsive: browser layout and interaction checks at responsive viewports",
    "browser_full: complete browser regression tier run on main",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.15",
    "httpx>=0.27",
    "playwright>=1.61.0",
    "coverage[toml]>=7.10",
    "ty>=0.0.56",
]
