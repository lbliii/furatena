[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "furatena"
version = "0.1.1"
description = "Hypermedia documentation catalog for Chirp — live graph, dual IR, fura CLI"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "Bengal Contributors", email = "lbeezr@icloud.com" }]
keywords = [
    "documentation",
    "hypermedia",
    "htmx",
    "catalog",
    "chirp",
    "markdown",
    "static-site",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "bengal-chirp[forms,sessions]>=0.9.0,<0.10.0",
    "chirp-ui>=0.11.0",
    "patitas[syntax]>=0.4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "milo-cli>=0.4.1",
    "reportlab>=5.0.0",
    "pypdf>=6.14.2",
    "bengal-pounce>=0.9.2,<0.10.0",
]

[project.optional-dependencies]
formats = [
    "docutils>=0.21",
]
dev = [
    "docutils>=0.21",
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff==0.15.20",
    "httpx>=0.27",
]

[project.scripts]
fura = "furatena.cli.main:main"

[project.entry-points."furatena.themes"]
lagoon = "furatena.themes.lagoon:PACK"

[project.urls]
Homepage = "https://github.com/lbliii/furatena"
Repository = "https://github.com/lbliii/furatena"
Documentation = "https://github.com/lbliii/furatena/tree/main/docs"

[tool.uv]
python-preference = "only-managed"

# Optional: local Chirp co-development. Uncomment and set path on your machine.
# [tool.uv.sources]
# bengal-chirp = { path = "../chirp", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"furatena.catalog" = [
  "py.typed",
  "schemas/*.json",
  "schemas/**/*.json",
  "fixtures/dcp/*.json",
  "eval_datasets/**/*.json",
  "eval_datasets/**/*.md",
  "mcp_app_assets/*.html",
  "_templates/**/*.html",
  "vendor/*.js",
]
"furatena.themes.lagoon" = [
  "*.css",
  "skin/*.css",
  "js/*.js",
  "assets/fonts/*.woff2",
]
"furatena.themes.docs" = [
  "presentation-pack.json",
  "README.md",
  "*.html",
  "layouts/*.html",
  "partials/*.html",
  "templates/**/*.html",
  "views/*.html",
]
"furatena.themes.furatena" = [
  "assets/css/**/*.css",
  "assets/icons/**/*.svg",
  "assets/icons/**/*.md",
]
"furatena.themes.vanilla" = [
  "presentation-pack.json",
  "README.md",
  "*.html",
  "*.css",
  "layouts/*.html",
  "partials/*.html",
  "views/*.html",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "SIM", "I", "RUF", "ANN201", "S110", "S112"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "E402", "RUF012", "S101"]
"app/**/*.py" = ["E402", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
asyncio_mode = "auto"
addopts = ["-ra", "-q", "--import-mode=importlib"]
markers = [
    "slow: runs a larger static export or frozen-catalog path",
    "browser: runs a real browser against a local Furatena server",
    "browser_smoke: smallest critical browser search, navigation, and author reload paths",
    "browser_authoring: browser author preview, edit, save, and create workflows",
    "browser_responsive: browser layout and interaction checks at responsive viewports",
    "browser_htmx4: pinned htmx 4 preview compatibility coverage",
    "browser_full: complete browser regression tier run on main",
]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
package = "furatena"
package_dir = "src"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] — {project_date}"
issue_format = "[#{issue}](https://github.com/lbliii/furatena/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff==0.15.20",
    "httpx>=0.27",
    "playwright>=1.61.0",
    "coverage[toml]>=7.10",
    "ty>=0.0.57",
    "towncrier>=25.8.0",
]
