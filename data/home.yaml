# Furatena home page — component data for views/home.html
# Loaded via site.home.data in app/docs.yaml

aria_label: Furatena overview

cta_primary:
  label: Get started
  href: /docs/get-started/
cta_secondary:
  label: Browse docs
  href: /docs/

hero_points:
  - Edit Markdown locally
  - Preview changes instantly
  - Publish to GitHub Pages

metrics_head:
  eyebrow: What changes
  title: Less tool juggling, more docs shipping
  subtitle: Furatena turns a Markdown folder into a fast docs site with search, navigation, and static publishing built in.

metrics:
  - value: "01"
    label: One source of truth
    hint: Write in Markdown and let the site build navigation, search, and exports from it.
  - value: Live
    label: Live preview loop
    hint: Preview your docs while you write instead of running a publish step after every edit.
  - value: Static
    label: Static publishing target
    hint: Ship to GitHub Pages or any static host without changing how authors write docs.

visual:
  aria_label: Preview of Furatena documentation surfaces
  eyebrow: Write to publish
  title: Write docs. Preview instantly. Publish anywhere.
  description: >
    Keep your docs in Markdown, get a polished local preview, and ship the same content as a static site.
  proof_tags:
    - Markdown
    - Search
    - GitHub Pages
    - AI-ready
  feature_title: Everything stays in sync
  feature_body: Navigation, search, references, and machine-readable indexes all come from the same docs.
  cta_label: Open docs
  cta_href: /docs/

ideas:
  eyebrow: Why teams use it
  title: A calmer way to build product docs
  subtitle: Keep authoring simple, keep previews fast, and keep every publishing output tied to the same source.
  features:
    - eyebrow: Author
      title: Write in plain Markdown
      body: >
        Keep docs close to the codebase. Furatena turns folders, front matter,
        headings, and links into a navigable site without making authors learn a CMS.
      action:
        label: Start writing
        href: /docs/get-started/
    - eyebrow: Preview
      title: See changes while you write
      body: >
        Run the local server, edit a page, and keep moving. The authoring loop
        feels like working in your app, not waiting on a static-site pipeline.
      action:
        label: Local workflow
        href: /docs/operations/
    - eyebrow: Publish
      title: Ship once, reuse everywhere
      body: >
        Publish a static docs site and reuse the same source for search,
        AI-friendly indexes, and reference pages.
      action:
        label: Publishing options
        href: /develop/

sources:
  eyebrow: Source adapters
  title: Bring the docs you already have
  subtitle: >
    Markdown is the polished default, but Furatena is not locked to one authoring
    syntax. Configure mounts to adapt other source formats into the same pages,
    navigation, search, and outputs.
  formats:
    - label: Markdown
      detail: First-class authoring
      body: >
        Write with front matter, wikilinks, directives, and local preview as the
        primary authoring loop.
    - label: MDX
      detail: JSX-aware migration path
      body: >
        Lower MDX components into Furatena directives so existing JS-docs content
        can move into the catalog instead of starting from scratch.
    - label: reStructuredText
      detail: docutils adapter
      body: >
        Bring RST pages forward when migrating Sphinx-style docs, while preserving
        headings, links, and page text for search.
    - label: HTML
      detail: Bridge adapter
      body: >
        Index existing HTML headings, links, and structured markers when a page
        needs to enter the docs system as-is.
  note: Register custom adapters and map file extensions in mounts.yaml when a source needs its own parser.

explore:
  title: Start with
  links:
    - label: Get started
      href: /docs/get-started/
    - label: Local preview
      href: /docs/operations/
    - label: CLI reference
      href: /docs/reference/cli/
    - label: Search and AI outputs
      href: /develop/

pipeline:
  eyebrow: Workflow
  title: From draft to published docs
  subtitle: One editing flow carries your docs from local writing to static hosting, app deployment, and reusable indexes.
  current_step: 4
  steps:
    - id: markdown
      label: Write
    - id: preview
      label: Preview
    - id: review
      label: Review
    - id: export
      label: Publish
    - id: reuse
      label: Reuse
  modes:
    - title: Local preview
      subtitle: While you write
      body: >
        Work against a fast local docs site, with navigation and search built from your Markdown.
    - title: Shareable build
      subtitle: Before launch
      body: >
        Generate the same pages your users will see, then review them before publishing.
    - title: Static site
      subtitle: Ready to host
      body: Ship GitHub Pages or offline bundles without changing how authors write docs.
      variant: ship

deployments:
  eyebrow: Deployment choices
  title: Static site when simple is enough. Living app when docs need to respond.
  subtitle: >
    Furatena can publish traditional static docs or run as a deployed Chirp app,
    so teams can start simple and add runtime behavior when the product needs it.
  options:
    - label: Static docs site
      title: Fast, portable, and easy to host
      body: >
        Export HTML for GitHub Pages, a CDN, or an offline bundle. This is the
        right default when public docs need to be fast, cheap, and durable.
    - label: Living docs app
      title: Runtime docs with product context
      body: >
        Deploy the docs app on Railway or another app host when you need login,
        gated sections, user-specific content, telemetry, or live integrations.
  future:
    label: Opens the door to
    items:
      - Authenticated docs
      - Persona-aware content
      - Usage analytics
      - MCP or API endpoints

exports:
  title: Ready for search and AI tools
  subtitle: Publish the docs site and keep structured outputs for search, references, and AI assistants.
  action:
    label: View outputs
    href: /develop/

quick_start:
  eyebrow: Run locally
  title: Start in two commands
  commands: |
    uv sync --group dev
    uv run fura serve
  caption: Open http://127.0.0.1:8001/ and edit Markdown while the local docs site updates.

workflows:
  eyebrow: Everyday use
  title: What this replaces
  items:
    - text: Keep product docs next to the code they explain
    - text: Maintain reference docs without a separate publishing tool
    - text: Check links and docs structure in CI
    - text: Reuse the same docs for search, AI tools, and developer references

cta:
  title: Start with your existing Markdown
  body: Run the local preview, edit docs in place, and publish the same content when it is ready.
  secondary:
    label: See outputs
    href: /develop/
