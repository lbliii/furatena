# Furatena home page — product marketing content for views/home.html
# Loaded via site.home.data in app/docs.yaml

aria_label: Furatena content control plane overview

cta_primary:
  label: Explore the platform
  href: /platform/
cta_secondary:
  label: Inspect the proof
  href: /proof/

hero_points:
  - One governed technical corpus
  - Consistent human and agent surfaces
  - Repo-owned and independently deployable

metrics_head:
  eyebrow: Why a control plane
  title: Documentation is no longer one website
  subtitle: >
    Product guides, API references, search indexes, release knowledge, and agent
    context drift when every surface builds its own version of the truth.

metrics:
  - value: Sources
    label: Connect the corpus
    hint: Normalize Markdown, MDX, MyST, RST, HTML, OpenAPI, and code documentation into one model.
  - value: Policy
    label: Govern it once
    hint: Apply validation, access, edition, ownership, freshness, and provenance before content reaches a surface.
  - value: Surfaces
    label: Publish consistently
    hint: Generate web, static, search, reference, and agent outputs from the same reviewed graph.

visual:
  aria_label: Sources enter the Furatena graph and become human and agent outputs
  eyebrow: Governed content graph
  title: One corpus controls every documentation surface.
  description: >
    Furatena resolves structure, relationships, access, editions, and provenance
    before projecting technical knowledge to developers or agents.
  proof_tags:
    - Markdown + MDX
    - MyST + RST
    - OpenAPI + code
    - Governed graph
  feature_title: Human and agent parity
  feature_body: Websites, static releases, search, references, and agent context inherit the same source and policy decisions.
  cta_label: See the architecture
  cta_href: /platform/

ideas:
  eyebrow: The product
  title: Control the corpus, not just the website
  subtitle: >
    Rendering is one output. Furatena governs the technical knowledge that every
    documentation and agent surface depends on.
  features:
    - eyebrow: Govern
      title: Make the corpus inspectable
      body: >
        Build a typed graph with relationships, ownership, editions, lifecycle,
        access policy, validation findings, and source provenance attached.
      action:
        label: How the graph works
        href: /platform/
    - eyebrow: Publish
      title: Project one truth everywhere
      body: >
        Produce application pages, immutable static artifacts, search indexes,
        references, and machine-readable outputs without separate content systems.
      action:
        label: Inspect the outputs
        href: /develop/
    - eyebrow: Equip agents
      title: Deliver governed context
      body: >
        Filter retrieval by access, edition, mount, tag, URL, and freshness so an
        agent receives the right source context instead of an undifferentiated scrape.
      action:
        label: Agent delivery
        href: /agents/

sources:
  eyebrow: Migration and federation
  title: Bring the technical sources you already have
  subtitle: >
    Furatena adapts multiple authoring systems into the same graph and reports
    unsupported constructs before a migration rewrites the corpus.
  formats:
    - label: Markdown and MDX
      detail: Preserve the repo workflow
      body: >
        Keep Markdown first-class and lower supported MDX components into typed
        directives, with unsafe or manual conversions called out explicitly.
    - label: MyST and RST
      detail: Carry technical semantics forward
      body: >
        Bring Sphinx-style pages, references, and inventories into a modern web and
        agent delivery layer without treating them as opaque text.
    - label: OpenAPI and code
      detail: Connect prose to reference
      body: >
        Project API operations and Python objects as graph nodes that can be linked,
        searched, versioned, and retrieved beside narrative documentation.
    - label: HTML and custom adapters
      detail: Federate before replacing
      body: >
        Index existing sources through configured mounts and adapters so teams can
        consolidate knowledge without forcing an all-at-once rewrite.
  note: >
    Start with a structured migration report: safe conversions, manual blockers,
    links, ownership, and output risk.

explore:
  title: Explore Furatena
  links:
    - label: Platform
      href: /platform/
    - label: Agent delivery
      href: /agents/
    - label: Migration
      href: /migration/
    - label: Live proof
      href: /proof/

pipeline:
  eyebrow: One governed flow
  title: From fragmented sources to trusted delivery
  subtitle: >
    Normalize once, apply policy once, and let each surface inherit the same
    reviewed knowledge and boundaries.
  current_step: 3
  steps:
    - id: connect
      label: Connect
    - id: normalize
      label: Normalize
    - id: govern
      label: Govern
    - id: publish
      label: Publish
    - id: retrieve
      label: Retrieve
  modes:
    - title: Human documentation
      subtitle: Web and static
      body: >
        Deliver navigable documentation, references, search, and durable static
        releases from the governed corpus.
    - title: Platform contracts
      subtitle: CI and integrations
      body: >
        Expose graph, structure, route, inventory, freshness, and channel manifests
        as versioned build artifacts.
    - title: Agent context
      subtitle: Static and live retrieval
      body: >
        Give tools and agents source-grounded context with policy and edition filters
        applied before retrieval.
      variant: ship

deployments:
  eyebrow: Deployment control
  title: Keep the corpus portable and the boundaries inspectable
  subtitle: >
    Hosted convenience should not require surrendering the content model. Furatena
    keeps sources and artifacts usable across local, static, CI, and application environments.
  options:
    - label: Immutable delivery
      title: Static artifacts that stand on their own
      body: >
        Publish HTML, Markdown sidecars, indexes, inventories, and agent manifests to
        a CDN, GitHub Pages, an offline bundle, or an internal artifact store.
    - label: Application delivery
      title: Runtime search and retrieval where needed
      body: >
        Run the documentation application when teams need dynamic query, semantic
        retrieval, gated surfaces, telemetry, or product integrations.
  future:
    label: One policy boundary across
    items:
      - Browser documentation
      - Static releases
      - Search and references
      - Agent retrieval

exports:
  title: Inspect what the control plane produces
  subtitle: >
    The dogfood site publishes its graph, search, structure, route, channel, and
    agent contracts alongside the human documentation.
  action:
    label: Browse live outputs
    href: /develop/

quick_start:
  eyebrow: Local-first evaluation
  title: Run the control plane against a repository
  commands: |
    uv sync --group dev
    uv run fura serve --author
  caption: Open the author dashboard, inspect the graph, and trace one source page into its human and agent outputs.

workflows:
  eyebrow: Built for platform teams
  title: Use one corpus across the documentation lifecycle
  items:
    - text: Assess a mixed documentation estate before migration
      link:
        label: Migration workflow
        href: /migration/
    - text: Apply access, edition, freshness, and validation policy once
      link:
        label: Platform architecture
        href: /platform/
    - text: Publish human and machine-readable artifacts from the same build
      link:
        label: Inspect proof
        href: /proof/
    - text: Give agents precise, source-grounded context instead of a website scrape
      link:
        label: Agent delivery
        href: /agents/

cta:
  title: Start with the documentation you already have
  body: >
    Map the sources, identify migration risk, and see how one governed corpus could
    serve your developers, platform workflows, and agents.
  secondary:
    label: Assess your docs
    href: /migration/
