# Furatena home page — component data for views/home.html
# Loaded via site.home.data in app/docs.yaml

aria_label: Furatena overview

cta_primary:
  label: Get started
  href: /docs/get-started/
cta_secondary:
  label: CLI reference
  href: /docs/reference/cli/

metrics_head:
  eyebrow: Indexed at serve time
  title: One corpus, three guarantees

metrics:
  - value: "1"
    label: markdown corpus
    hint: Index pages from content/ mounts at serve time.
  - value: "0"
    label: rebuild loops while authoring
    hint: Partial reload on the open page via htmx swaps — no export step.
  - value: "∞"
    label: graph edges
    hint: Nav, search, and agents read the same catalog.

visual:
  aria_label: Preview of Furatena documentation surfaces
  eyebrow: Live catalog
  title: docs/get-started/installation.md
  description: >
    Shell persists. #page-root swaps on edit — no export loop, no full reload.
  proof_tags:
    - content/
    - graph
    - "#page-root"
  feature_title: Author reload
  feature_body: Partial htmx swap on the open doc page.
  cta_label: Open get started
  cta_href: /docs/get-started/

ideas:
  eyebrow: Catalog graph
  title: Markdown indexed into a live catalog
  subtitle: Structure for nav, search, and agents — not regex on rendered HTML.
  features:
    - eyebrow: Docs as data
      title: Markdown indexed into a queryable graph
      body: >
        Headings, links, and directives become Content IR at index time. Navigation,
        backlinks, search chunks, and agent tools read structure — not regex on HTML.
      action:
        label: Concepts
        href: /docs/concepts/
      code: |
        content/**/*.md
          └─► DocNode graph
               ├─ edges: nav, links
               ├─ chunks: search
               └─ exports: /catalog.json
    - eyebrow: Hypermedia shell
      title: Persistent chrome, swapping fragments
      body: >
        Boosted navigation replaces #page-root while the shell, search modal,
        and theme persist. No client framework. No npm build step for authoring.
      action:
        label: Philosophy
        href: /docs/about/philosophy/
      reverse: true
      code: |
        #shell (persistent)
          nav · search · theme
          #page-root ← htmx swap
            └─ doc fragment
    - eyebrow: Dual IR
      title: Content IR + Presentation IR
      body: >
        Patitas captures author intent. Kida captures view composition. Lint, incremental
        reload, and /catalog.json export use structure instead of scraping rendered HTML.
      action:
        label: Dual IR
        href: /docs/concepts/dual-ir/
      code: |
        Markdown ──► Content IR
        Kida views ──► Presentation IR
                 └──► #page-root HTML

explore:
  title: Go deeper
  links:
    - label: Hypermedia philosophy
      href: /docs/about/philosophy/
    - label: Dual IR
      href: /docs/concepts/dual-ir/
    - label: Agent exports
      href: /develop/
    - label: Bengal stack
      href: /docs/about/

pipeline:
  eyebrow: Delivery modes
  title: The pipeline
  subtitle: One markdown edit through the catalog graph to serve, freeze, or export.
  current_step: 4
  steps:
    - id: markdown
      label: Markdown
    - id: content-ir
      label: Content IR
    - id: view
      label: View
    - id: htmx
      label: htmx swap
    - id: export
      label: Export
  modes:
    - title: fura serve
      subtitle: Live authoring
      body: >
        Catalog graph + Kida views + htmx shell. Edit markdown and reload the open page
        via partial swaps.
    - title: fura freeze
      subtitle: Snapshot
      body: >
        Write catalog metadata and HTML shards for preview — same graph, frozen artifact.
    - title: fura export
      subtitle: Static site
      body: Ship GitHub Pages or offline bundles from the same indexed corpus.
      variant: ship

exports:
  title: Agent-native exports
  subtitle: Machine-readable surfaces ship with the product.
  action:
    label: All exports
    href: /develop/

quick_start:
  eyebrow: Run locally
  title: Quick start
  commands: |
    uv sync --group dev
    uv run fura serve
  caption: Open http://127.0.0.1:8001/ — edit markdown and watch the open page reload via partial swaps.

workflows:
  eyebrow: Authoring
  title: Common workflows
  items:
    - text: Dogfood your own product docs from content/<product>/
    - text: Keep a reference mount for regression testing
      link:
        label: Chirp
        href: /chirp/
    - text: Run fura check in CI for broken links, directive contracts, and theme lint
    - text: Expose /catalog.json, /search.json, and /tools.json for agents and IDE tooling

brand:
  eyebrow: Gold in the ledger
  title: The mark
  body: >
    The navbar mark 𐂛 is Linear B ideogram B141 — gold in Mycenaean palace inventories.
    Furatena tags markdown the same way: a live catalog of indexed docs, not a one-shot static build.

stack:
  eyebrow: Bengal
  title: The Bengal stack
  intro: Furatena is the documentation surface for the Bengal hypermedia ecosystem.
  footer: Python-native. Free-threading ready. Markdown-first authoring.
  rows:
    - mark: "𐂛"
      name: Furatena
      description: Documentation catalog ← You are here
      here: true
    - mark: "ᗢ"
      name: Chirp
      description: Web framework
      href: /chirp/
    - mark: "=^..^="
      name: Pounce
      description: ASGI server
      href: https://github.com/lbliii/pounce
    - mark: ")彡"
      name: Kida
      description: Template engine
      href: https://github.com/lbliii/kida
    - mark: "ฅᨐฅ"
      name: Patitas
      description: Markdown parser
      href: https://github.com/lbliii/patitas

cta:
  title: Start authoring
  body: Run fura serve, edit markdown, and ship the same corpus to agents and static hosting.
  secondary:
    label: Browse exports
    href: /develop/
