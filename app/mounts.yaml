mounts:
  - id: furatena
    label: Furatena Documentation
    content_root: ../content/furatena
    default: true

  - id: shared
    label: Shared Reference
    content_root: content/shared
    url_prefix: /shared
    extensions: [".md", ".html"]
    format_map:
      ".md": patitas-markdown
      ".html": html
