# Furatena app configuration
#
# Vocabulary — see VIEWS.md (views) and THEMING.md (theme/tokens):
#   shell       — persistent frame (#main, htmx boost, search modal)
#   view        — full page inside #page-root (theme/views/*.html)
#   view kind   — author label in front matter layout:/kind: → views: map
#   compose     — multi-node view enrichment (collection read-throughs)
#   theme       — tokens + styles + optional theme/templates/ shadow dir
#   templates/  — sparse project overrides (wins over theme + framework)
#   site        — product branding (name, home hero, top navigation copy)

shell: shell.html

views:
  doc: views/doc.html
  doc_list: views/doc_list.html
  page: views/page.html
  marketing_page: views/marketing_page.html
  home: views/home.html
  changelog: views/changelog.html
  collection: views/collection.html
  api_reference: views/api_reference.html
  portal: views/portal.html
  default: views/doc.html

compose:
  collection:
    data: ../data/collections.yaml

# Outer catalog icon rail. Logical journeys can own whole physical sections and
# selected pages, so the information architecture can evolve without changing URLs.
catalog:
  append_unlisted: false
  sections:
    - id: adopt
      label: Adopt
      icon: book-open
      sections: [get-started, about]
    - id: author
      label: Author
      icon: pencil
      sections: [authoring, theming]
    - id: publish
      label: Publish
      icon: rocket
      pages:
        - operations
        - operations/deploy
        - operations/deployment-profiles
        - operations/freeze-and-export
        - operations/migrate-from-js-docs
    - id: operate
      label: Operate
      icon: check-circle
      href: /docs/operations/serve-and-author/
      pages:
        - operations/serve-and-author
        - operations/check-and-lint
        - operations/docs-quality
        - operations/observability-and-recovery
    - id: integrate
      label: Integrate
      icon: code
      href: /docs/operations/consume-agent-outputs/
      sections: [concepts, reference]
      pages:
        - operations/consume-agent-outputs
        - operations/agent-readiness-score
        - concepts/static-vs-live-agent-readiness

site:
  name: Furatena
  tagline: Technical documentation, governed once
  description: >
    Build one governed knowledge graph from your technical sources, then publish
    consistent documentation for developers and precise context for AI agents.
  mark: "𐂛"
  home:
    data: ../data/home.yaml
  navigation:
    documentation:
      menu_label: Product
      dropdown_href: /platform/
      overview:
        href: /platform/
        kicker: Control plane
        title: Govern technical knowledge once
        blurb: Connect sources, policies, and delivery surfaces through one inspectable graph.
      links:
        - href: /agents/
          label: Agent delivery
          blurb: Give agents current, authorized, source-grounded context.
          icon: code
        - href: /migration/
          label: Migration
          blurb: Understand conversion risk before changing source files.
          icon: layers
        - href: /proof/
          label: Platform proof
          blurb: Inspect the artifacts, pilots, and safety boundaries.
          icon: check-circle
    develop:
      menu_label: Resources
      dropdown_href: /docs/
      overview:
        href: /docs/
        kicker: Build with Furatena
        title: Documentation and live outputs
        blurb: Learn the system, inspect its contracts, and follow an implementation path.
      links:
        - href: /docs/get-started/
          label: Get started
          blurb: Run Furatena and prove the first workflow.
          icon: book-open
        - href: /docs/operations/consume-agent-outputs/
          label: Agent integration
          blurb: Use static artifacts, retrieval endpoints, and MCP.
          icon: code
        - href: /develop/
          label: Inspect live outputs
          blurb: Browse the catalog, search, routes, and tool manifests.
          icon: search

theme:
  use: lagoon
  id: furatena
  templates: theme/templates
  effects:
    code: flat
    cards: flat
    hero: wash
  measure:
    prose: 80ch
    reading: 76ch
    docs: 80ch
    container: 90rem
  fonts:
    sans: Inter
    display: Outfit

mounts: mounts.yaml

rewrites: ../data/url_rewrites.yaml
inventories: inventories.yaml
