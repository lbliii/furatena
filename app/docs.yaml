# Furatena app configuration
#
# Vocabulary — see VIEWS.md (views) and THEMING.md (theme/tokens):
#   shell       — persistent frame (#main, htmx boost, search modal)
#   view        — full page inside #page-root (theme/views/*.html)
#   view kind   — author label in front matter layout:/kind: → views: map
#   compose     — multi-node view enrichment (collection read-throughs)
#   theme       — tokens + styles + optional theme/templates/ shadow dir
#   templates/  — sparse project overrides (wins over theme + framework)
#   site        — product branding (name, home hero, top navigation copy)

shell: shell.html

views:
  doc: views/doc.html
  doc_list: views/doc_list.html
  page: views/page.html
  home: views/home.html
  changelog: views/changelog.html
  collection: views/collection.html
  portal: views/portal.html
  default: views/doc.html

compose:
  collection:
    data: ../data/collections.yaml

# Outer catalog icon rail — optional explicit section order and metadata.
# Omit ``sections`` to auto-detect top-level ``docs/<section>/`` folders from content.
catalog:
  sections:
    - id: get-started
      icon: book-open
    - concepts
    - authoring
    - theming
    - operations
    - reference
    - about

site:
  name: Furatena
  tagline: Hypermedia documentation catalog
  description: >
    Furatena documentation — markdown indexed into a live graph, served as htmx
    fragments inside a persistent shell.
  mark: "𒀭"
  home:
    cta_primary:
      label: Get started
      href: /docs/get-started/
    cta_secondary:
      label: CLI reference
      href: /docs/reference/cli/
    visual:
      title: Docs as data, HTML on demand.
      description: >
        Markdown indexed into a live graph — pages and fragments served through an
        htmx shell without a static export loop.

theme:
  use: lagoon
  id: furatena
  templates: theme/templates
  effects:
    code: flat
    cards: flat
    hero: wash
  measure:
    prose: 80ch
    reading: 76ch
    docs: 80ch
    container: 90rem
  fonts:
    sans: Inter
    display: Inter

mounts: mounts.yaml

rewrites: ../data/url_rewrites.yaml
inventories: inventories.yaml
